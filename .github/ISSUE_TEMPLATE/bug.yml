name: Bug
description: Report a Riftcore platform defect
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the shortest reliable reproduction steps.
    validations:
      required: true
  - type: input
    id: tournament
    attributes:
      label: Tournament or match ID
      description: Leave blank when the issue is not event-specific.
